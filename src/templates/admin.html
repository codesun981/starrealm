<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>豆豆书签 - 管理中心</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <script>
    (function() {
      try {
        var root = document.documentElement;
        // 桌面风改造（fork）：后台固定 macOS 浅色主题，与前台保持一致。
        root.classList.remove('dark');
        root.classList.remove('omc', 'cyber');
        // 被前台桌面以悬浮窗嵌入时（?embed=1）隐藏自带窗口栏，外层窗口负责边框与标题栏。
        if (new URLSearchParams(location.search).has('embed')) root.classList.add('embed');
      } catch (e) {}
    })();
  </script>
  <style>html,body{background:#f5f5f7}</style>
  <link rel="stylesheet" href="/static/admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
</head>
<body>
  <div class="admin-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- macOS 设置式窗口（fork 改造）：红绿灯标题栏 + 左侧栏导航 + 右侧内容区 -->
  <div class="container">
    <div class="windowbar">
      <div class="traffic-lights">
        <a class="tl tl-close" href="/" title="回前台桌面" aria-label="回前台桌面"></a>
        <span class="tl tl-min" aria-hidden="true"></span>
        <span class="tl tl-max" aria-hidden="true"></span>
      </div>
      <span class="windowbar-title">豆豆设置</span>
      <div class="windowbar-actions">
        <a href="/" class="home-link-btn" title="返回前台导航首页">前台首页</a>
        <form method="post" action="/admin/logout" style="margin:0;">
          <button type="submit" class="logout-btn">退出</button>
        </form>
      </div>
    </div>

    <div class="settings-body-grid">
      <aside class="settings-sidebar">
        <div class="sidebar-brand">
          <div class="brand-badge" aria-hidden="true"><img src="/logo.png" alt=""></div>
          <div class="sb-text">
            <div class="sb-name">豆豆书签</div>
            <div class="sb-meta">管理中心</div>
          </div>
        </div>

        <nav class="tab-buttons" aria-label="设置分区">
          <button class="tab-button active" data-tab="config">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-4-7 4V5z"/></svg>
            <span>书签列表</span>
          </button>
          <button class="tab-button" data-tab="categories">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>
            <span>分类管理</span>
          </button>
          <button class="tab-button" data-tab="appearance">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path stroke-linecap="round" stroke-linejoin="round" d="M21 16l-5-5-9 9"/></svg>
            <span>外观</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="import-export">
            <input type="file" id="importFile" accept=".json" style="display:none;">
            <button type="button" id="importBtn" class="btn-secondary">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
              导入
            </button>
            <button type="button" id="exportBtn" class="btn-secondary">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
              导出
            </button>
          </div>
          <button type="button" id="adminStyleToggle" class="theme-toggle-btn" title="切换主题风格（默认 / 极客 / 摇滚）" aria-label="切换主题风格">默认</button>
          <button type="button" id="adminThemeToggle" class="theme-toggle-btn" title="切换浅色/深色模式" aria-label="切换浅色/深色模式">切换明暗</button>
        </div>
      </aside>

      <main class="settings-main">
        <div class="control-bar">
          <div class="head-text">
            <div class="main-tab-title" id="mainTabTitle">书签列表</div>
            <p class="main-tab-sub" id="mainTabSub">管理全部书签的排序、分类与显示。</p>
          </div>
          <div class="toolbar-right" id="toolbarRight">
            <button type="button" id="toggleAddPanelBtn" class="btn-primary-action">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
              <span>新增书签</span>
            </button>
          </div>
        </div>

        <!-- 可折叠的新增书签表单面板 -->
        <div class="add-new" id="addNewPanel">
          <div class="add-new-header">
            <span class="add-new-title">快速添加新书签</span>
            <button type="button" id="closeAddPanelBtn" class="add-new-close" title="收起面板">&times;</button>
          </div>
          <div class="add-new-grid">
            <div class="field-item">
              <label for="addName">站点名称 *</label>
              <input type="text" id="addName" placeholder="例如：GitHub" required>
            </div>
            <div class="field-item">
              <label for="addUrl">站点网址 *</label>
              <input type="text" id="addUrl" placeholder="https://github.com" required>
            </div>
            <div class="field-item">
              <label for="addCatelog">所属分类 *</label>
              <select id="addCatelog" required title="选择分类">
                <option value="">加载分类中...</option>
              </select>
            </div>
            <div class="field-item">
              <label for="addLogo">图标链接</label>
              <input type="text" id="addLogo" placeholder="https://.../favicon.ico">
            </div>
            <div class="field-item field-desc">
              <label for="addDesc">站点描述</label>
              <input type="text" id="addDesc" placeholder="站点简介（可选）">
            </div>
            <div class="field-item field-sort">
              <label for="addSortOrder">排序权重</label>
              <input type="number" id="addSortOrder" placeholder="默认 9999">
            </div>
            <div class="field-item field-submit">
              <label>&nbsp;</label>
              <button id="addBtn" type="button">确认添加</button>
            </div>
          </div>
        </div>

        <div id="message" style="display: none;"></div>

        <!-- 主内容与表格区 -->
        <div class="tab-wrapper">
          <div id="config" class="tab-content active">
            <div id="configList" class="bm-list"></div>
            <div class="pagination bm-pagination" id="configPagination">
              <button id="prevPage" disabled>上一页</button>
              <span class="page-indicator">第 <span id="currentPage">1</span> / <span id="totalPages">1</span> 页</span>
              <button id="nextPage" disabled>下一页</button>
            </div>
          </div>

          <div id="categories" class="tab-content">
            <div class="cat-toolbar">
              <input type="text" id="newCategoryName" placeholder="输入新分类名称 (如：开发工具)" maxlength="50">
              <input type="number" id="newCategorySort" placeholder="排序权重 (默认 9999)">
              <button type="button" id="createCategoryBtn" class="category-create-btn">+ 创建分类</button>
              <button id="refreshCategories" type="button" class="btn-secondary cat-refresh">刷新列表</button>
            </div>
            <div id="categoryList" class="bm-list"></div>
          </div>

          <div id="appearance" class="tab-content">
            <div class="settings-wrapper">
              <div class="settings-card">
                <h2 class="settings-title">桌面壁纸</h2>
                <img id="wpPreview" class="wp-preview" src="/wallpaper.jpg?v=3" alt="当前壁纸预览">
                <div class="wp-actions">
                  <input type="file" id="wpFile" accept="image/jpeg,image/png,image/webp,image/avif" hidden>
                  <button type="button" id="wpUploadBtn" class="btn-primary-action">上传图片…</button>
                  <button type="button" id="wpResetBtn" class="btn-secondary">恢复默认壁纸</button>
                </div>
                <p class="wp-note" id="wpStatus">自定义壁纸保存在 Cloudflare KV 中（不占任何服务器），所有设备打开都是同一张；上传时自动压缩到宽 2560 以内。</p>
              </div>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>
  <script src="/static/admin.js"></script>
  <script>
    // 内容区大标题跟随左侧栏选中项（fork 新增，仅展示同步）；
    // 搜索与新增只属于书签列表，其余分区隐藏工具栏，免得设置页顶着无关控件。
    (function () {
      var title = document.getElementById('mainTabTitle');
      var sub = document.getElementById('mainTabSub');
      var toolbar = document.getElementById('toolbarRight');
      var SUBS = {
        config: '管理全部书签的排序、分类与显示。',
        categories: '新建、改名与调整分类的顺序。',
        appearance: '桌面壁纸，保存在 Cloudflare KV 中。'
      };
      document.querySelectorAll('.tab-button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var span = btn.querySelector('span');
          if (title && span) title.textContent = span.textContent;
          if (sub) sub.textContent = SUBS[btn.getAttribute('data-tab')] || '';
          if (toolbar) toolbar.style.display = btn.getAttribute('data-tab') === 'config' ? '' : 'none';
        });
      });
    })();
  </script>
  <script>
    // 外观分区：壁纸上传/恢复（fork 新增）。上传前在浏览器内压缩，存入 KV。
    (function () {
      var fileInput = document.getElementById('wpFile');
      var status = document.getElementById('wpStatus');
      var preview = document.getElementById('wpPreview');
      if (!fileInput) return;
      function refreshPreview() { preview.src = '/wallpaper.jpg?t=' + Date.now(); }
      function shrink(file) {
        return createImageBitmap(file).then(function (bmp) {
          var scale = Math.min(1, 2560 / bmp.width);
          if (scale >= 1 && file.size < 1500000) return file;
          var canvas = document.createElement('canvas');
          canvas.width = Math.round(bmp.width * scale); canvas.height = Math.round(bmp.height * scale);
          canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
          return new Promise(function (res) { canvas.toBlob(function (b) { res(b || file); }, 'image/jpeg', 0.82); });
        }).catch(function () { return file; });
      }
      document.getElementById('wpUploadBtn').addEventListener('click', function () { fileInput.click(); });
      fileInput.addEventListener('change', function () {
        var file = fileInput.files && fileInput.files[0];
        if (!file) return;
        status.textContent = '上传中…';
        shrink(file).then(function (blob) {
          return fetch('/api/wallpaper', { method: 'POST', headers: { 'Content-Type': blob.type || 'image/jpeg' }, body: blob });
        }).then(function (r) {
          if (!r.ok) throw new Error('bad');
          status.textContent = '已更新：关掉设置窗，桌面就是新壁纸。';
          refreshPreview();
        }).catch(function () { status.textContent = '上传失败，换张图试试。'; });
        fileInput.value = '';
      });
      document.getElementById('wpResetBtn').addEventListener('click', function () {
        status.textContent = '恢复中…';
        fetch('/api/wallpaper', { method: 'DELETE' }).then(function (r) {
          if (!r.ok) throw new Error('bad');
          status.textContent = '已恢复默认壁纸。';
          refreshPreview();
        }).catch(function () { status.textContent = '恢复失败。'; });
      });
    })();
  </script>
</body>
</html>
