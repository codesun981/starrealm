<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星境书签</title>
<style>
/* 桌面风前台（fork 重写）：视觉语言借鉴 GlassDesk（MIT）的 Liquid Glass 材质体系：
   壁纸铺满 + 玻璃拟态 + 桌面图标 + Dock。材质变量与其 tokens.css 同源思路。 */
:root {
  color-scheme: dark;
  --font-sans: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", system-ui, sans-serif;
  --ink: #f4f5f7; --ink-2: #c6c9d1; --ink-3: #8f939e;
  --glass-bg: rgb(26 29 36 / 42%);
  --glass-card: rgb(22 25 32 / 52%);
  --glass-border: rgb(255 255 255 / 16%);
  --glass-line: rgb(255 255 255 / 10%);
  --glass-gloss: linear-gradient(155deg, rgb(255 255 255 / 15%), rgb(255 255 255 / 4%) 34%, transparent 62%);
  --glass-shadow: 0 30px 64px -26px rgb(0 0 0 / 74%), 0 4px 12px rgb(0 0 0 / 24%);
  --glass-inner: inset 0 1px 0 rgb(255 255 255 / 26%), inset 0 -1px 0 rgb(0 0 0 / 28%), inset 0 0 0 0.5px rgb(255 255 255 / 6%);
  --blur: 32px; --sat: 1.8;
  --radius-panel: 20px;
  --wallpaper-shadow: 0 1px 3px rgb(0 0 0 / 88%), 0 0 14px rgb(0 0 0 / 40%);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: var(--font-sans); color: var(--ink); overflow: hidden;
  background: #0a1128 url('/wallpaper.jpg?v=3') center / cover no-repeat fixed;
}
body::before { content: ''; position: fixed; inset: 0; background: linear-gradient(180deg, rgb(0 0 0 / 18%), transparent 22%, transparent 78%, rgb(0 0 0 / 26%)); pointer-events: none; }
.glass {
  background: var(--glass-bg);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--sat)) brightness(1.04);
  backdrop-filter: blur(var(--blur)) saturate(var(--sat)) brightness(1.04);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow), var(--glass-inner);
  position: relative;
}
.glass::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: var(--glass-gloss); pointer-events: none; }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass { background: rgb(24 27 34 / 92%); }
}
@media (prefers-reduced-transparency: reduce) { .glass { background: rgb(24 27 34 / 94%); -webkit-backdrop-filter: none; backdrop-filter: none; } }

/* 顶部菜单栏 */
.menubar {
  position: fixed; top: 0; left: 0; right: 0; height: 36px; z-index: 60;
  display: flex; align-items: center; gap: 4px; padding: 0 14px;
  border-left: none; border-right: none; border-top: none; border-radius: 0;
}
.menubar .brand { font-weight: 700; font-size: 13.5px; letter-spacing: .02em; margin-right: 8px; text-shadow: var(--wallpaper-shadow); white-space: nowrap; }
.menu-item {
  appearance: none; border: none; background: transparent; color: var(--ink-2); cursor: pointer;
  font: 500 13px var(--font-sans); padding: 4px 9px; border-radius: 6px; white-space: nowrap;
}
.menu-item:hover { background: rgb(255 255 255 / 12%); color: var(--ink); }
.menu-item.active { color: var(--ink); font-weight: 700; }
.menubar .spacer { flex: 1; }
.menubar .meta { font-size: 12.5px; color: var(--ink); font-variant-numeric: tabular-nums; text-shadow: var(--wallpaper-shadow); white-space: nowrap; }
.menubar .meta .dim { color: var(--ink-2); margin-right: 8px; }

/* 灵动岛搜索 */
.island {
  position: fixed; top: 5px; left: 50%; transform: translateX(-50%); z-index: 70;
  display: flex; align-items: center; gap: 8px; width: min(430px, 44vw); height: 26px;
  padding: 0 14px; border-radius: 999px; background: rgb(10 12 16 / 78%);
  border: 1px solid rgb(255 255 255 / 14%); box-shadow: 0 10px 30px rgb(0 0 0 / 45%), inset 0 1px 0 rgb(255 255 255 / 14%);
  transition: width .28s var(--ease-out), background .28s var(--ease-out);
}
.island:focus-within { width: min(520px, 56vw); background: rgb(8 10 14 / 92%); }
.island svg { width: 13px; height: 13px; color: var(--ink-3); flex: none; }
.island input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: var(--ink); font: 400 13px var(--font-sans); }
.island input::placeholder { color: var(--ink-3); }
.island kbd { font: 500 10.5px var(--font-sans); color: var(--ink-3); border: 1px solid rgb(255 255 255 / 18%); border-radius: 4px; padding: 1px 5px; }

/* 舞台与桌面 */
.stage { position: fixed; inset: 36px 0 0 0; }
.desktop {
  position: absolute; inset: 0; padding: 26px 34px 120px 356px;
  opacity: 0; transform: scale(.985); pointer-events: none;
  transition: opacity .3s var(--ease-out), transform .3s var(--ease-out);
  overflow-y: auto; scrollbar-width: none;
}
.desktop::-webkit-scrollbar { display: none; }
.desktop.active { opacity: 1; transform: scale(1); pointer-events: auto; }
.desk-head { display: flex; align-items: baseline; gap: 10px; justify-content: flex-end; margin-bottom: 16px; }
.desk-head h2 { font-size: 17px; font-weight: 700; text-shadow: var(--wallpaper-shadow); }
.desk-head span { font-size: 12px; color: var(--ink-2); text-shadow: var(--wallpaper-shadow); }
.icon-grid { display: grid; grid-template-columns: repeat(auto-fill, 96px); gap: 20px 14px; justify-content: end; align-content: start; }
.desk-empty { grid-column: 1 / -1; text-align: right; color: var(--ink-2); font-size: 13px; text-shadow: var(--wallpaper-shadow); }

/* 桌面图标 */
.app { display: flex; flex-direction: column; align-items: center; gap: 7px; text-decoration: none; width: 96px; }
.app-icon {
  position: relative; width: 66px; height: 66px; border-radius: 17px; overflow: visible;
  background: rgb(255 255 255 / 90%); box-shadow: 0 10px 24px rgb(0 0 0 / 38%), inset 0 1px 0 rgb(255 255 255 / 65%);
  display: flex; align-items: center; justify-content: center;
  transition: transform .18s var(--ease-out);
}
.app:hover .app-icon { transform: scale(1.07); }
.app:active .app-icon { transform: scale(.96); }
.app-icon img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 17px; }
.app-letter { position: absolute; inset: 0; border-radius: 17px; display: flex; align-items: center; justify-content: center; font-size: 27px; font-weight: 700; color: #fff; text-shadow: 0 1px 4px rgb(0 0 0 / 30%); }
.app-badge {
  position: absolute; right: -5px; bottom: -5px; width: 19px; height: 19px; border-radius: 6px; z-index: 2;
  background: rgb(20 22 28 / 82%); color: #fff; display: flex; align-items: center; justify-content: center;
  border: 1px solid rgb(255 255 255 / 25%); opacity: 0; transform: scale(.7); transition: all .16s var(--ease-out);
}
.app-badge svg { width: 11px; height: 11px; }
.app:hover .app-badge { opacity: 1; transform: scale(1); }
.app-name {
  font-size: 12px; font-weight: 500; color: #fff; text-align: center; line-height: 1.3; max-width: 96px;
  text-shadow: var(--wallpaper-shadow); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

/* 左侧小组件 */
.widgets { position: fixed; left: 22px; top: 62px; width: 302px; z-index: 30; display: flex; flex-direction: column; gap: 16px; }
.widget { border-radius: var(--radius-panel); padding: 18px 20px; background: var(--glass-card); }
.widget h3 { font-size: 12px; font-weight: 600; color: var(--ink-2); letter-spacing: .06em; margin-bottom: 10px; position: relative; z-index: 1; }
.widget .clock-time { font-size: 52px; font-weight: 700; letter-spacing: -.01em; line-height: 1; font-variant-numeric: tabular-nums; position: relative; z-index: 1; }
.widget .clock-date { margin-top: 8px; font-size: 13px; color: var(--ink-2); position: relative; z-index: 1; }
.widget .clock-stats { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--glass-line); font-size: 12px; color: var(--ink-3); position: relative; z-index: 1; }
.widget textarea {
  position: relative; z-index: 1; width: 100%; min-height: 118px; resize: vertical;
  background: transparent; border: none; outline: none; color: var(--ink);
  font: 400 13.5px/1.65 var(--font-sans);
}
.widget textarea::placeholder { color: var(--ink-3); }
.widget .note-foot { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-3); margin-top: 6px; position: relative; z-index: 1; }

/* 搜索结果态 */
.results { position: absolute; inset: 0; padding: 26px 34px 120px; overflow-y: auto; scrollbar-width: none; display: none; }
.results::-webkit-scrollbar { display: none; }
.results.show { display: block; }
.results .desk-head { justify-content: flex-start; }
.results .icon-grid { justify-content: start; }
body.searching .desktop, body.searching .widgets { display: none; }

/* 桌面圆点 */
.dots { position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%); z-index: 46; display: flex; gap: 8px; }
.dot { width: 7px; height: 7px; border-radius: 50%; border: none; cursor: pointer; background: rgb(255 255 255 / 38%); transition: all .2s var(--ease-out); padding: 0; }
.dot.active { background: #fff; transform: scale(1.25); }
body.searching .dots { display: none; }

/* Dock */
.dock-wrap { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 47; }
.dock { display: flex; align-items: flex-end; gap: 9px; padding: 9px 11px; border-radius: 24px; }
.dock-app { position: relative; display: block; text-decoration: none; }
.dock-icon {
  position: relative; width: 50px; height: 50px; border-radius: 13px; overflow: hidden;
  background: rgb(255 255 255 / 90%); box-shadow: 0 8px 18px rgb(0 0 0 / 35%);
  display: flex; align-items: center; justify-content: center;
  transition: transform .16s var(--ease-out); transform-origin: bottom center;
}
.dock-icon img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.dock-icon .app-letter { border-radius: 13px; font-size: 21px; }
.dock-app::after {
  content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 14px); transform: translateX(-50%) scale(.9);
  background: rgb(24 26 32 / 92%); color: var(--ink); font-size: 12px; padding: 4px 10px; border-radius: 7px;
  border: 1px solid rgb(255 255 255 / 14%); white-space: nowrap; opacity: 0; pointer-events: none; transition: all .15s var(--ease-out);
}
.dock-app:hover::after { opacity: 1; transform: translateX(-50%) scale(1); }
.dock-sep { width: 1px; align-self: stretch; margin: 4px 2px; background: rgb(255 255 255 / 22%); }
.dock-admin .dock-icon { background: linear-gradient(160deg, #5b6472, #2c313a); color: #fff; }
.dock-admin svg { width: 26px; height: 26px; position: relative; z-index: 1; }

/* 显示模式切换（菜单栏右侧小胶囊） */
.view-toggle { display: inline-flex; background: rgb(255 255 255 / 10%); border: 1px solid rgb(255 255 255 / 12%); border-radius: 999px; padding: 2px; margin-right: 12px; position: relative; z-index: 1; }
.view-toggle button { appearance: none; border: none; background: transparent; color: var(--ink-2); font: 500 11.5px var(--font-sans); padding: 2.5px 10px; border-radius: 999px; cursor: pointer; }
.view-toggle button.active { background: rgb(255 255 255 / 88%); color: #14161c; font-weight: 600; }

/* 卡片模式：图标 + 名称 + 描述 + 域名 */
.app-info { display: none; }
body[data-view="card"] .desktop .icon-grid,
body[data-view="card"] .results .icon-grid { grid-template-columns: repeat(auto-fill, minmax(288px, 1fr)); justify-content: start; gap: 14px; }
body[data-view="card"] .app {
  flex-direction: row; width: auto; align-items: center; gap: 13px; text-align: left;
  background: var(--glass-card); border: 1px solid var(--glass-border); border-radius: var(--radius-card);
  padding: 13px 15px; box-shadow: var(--glass-shadow), var(--glass-inner);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--sat)); backdrop-filter: blur(var(--blur)) saturate(var(--sat));
  transition: transform .16s var(--ease-out), background .16s var(--ease-out);
}
body[data-view="card"] .app:hover { transform: translateY(-2px); }
body[data-view="card"] .app-icon { width: 47px; height: 47px; border-radius: 12px; flex: none; }
body[data-view="card"] .app-letter { border-radius: 12px; font-size: 20px; }
body[data-view="card"] .app-icon img { border-radius: 12px; }
body[data-view="card"] .app-name { display: none; }
body[data-view="card"] .app-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
body[data-view="card"] .app-title { font-size: 14px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body[data-view="card"] .app-desc { font-size: 12px; color: var(--ink-2); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
body[data-view="card"] .app-domain { font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 悬浮设置窗（像真实系统里的应用窗口：玻璃边框 + 标题栏拖动 + 红点关闭） */
.settings-window {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(1080px, 94vw); height: min(720px, 88dvh); z-index: 90;
  border-radius: 22px; overflow: hidden; display: flex; flex-direction: column;
}
.settings-window[hidden] { display: none; }
.settings-window.opening { animation: swIn .22s var(--ease-out); }
@keyframes swIn { from { opacity: 0; transform: translate(-50%, -50%) scale(.965); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
.settings-window.dragged { transform: none; }
.sw-bar {
  position: relative; z-index: 1; height: 42px; flex: none;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px; border-bottom: 1px solid rgb(255 255 255 / 8%);
  cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none;
}
.sw-bar:active { cursor: grabbing; }
.traffic-lights { display: flex; gap: 8px; align-items: center; width: 60px; }
.tl { width: 12px; height: 12px; border-radius: 50%; border: none; padding: 0; display: inline-block; }
button.tl-close { background: #ff5f57; cursor: pointer; box-shadow: inset 0 0 2px rgb(0 0 0 / 25%); }
button.tl-close:hover { filter: brightness(1.1); }
.tl-min { background: #febc2e; }
.tl-max { background: #28c840; }
.sw-title { font-size: 13px; font-weight: 600; color: var(--ink-2); letter-spacing: .02em; }
.sw-spacer { width: 60px; }
.settings-window iframe { position: relative; z-index: 1; flex: 1; width: 100%; border: 0; background: transparent; }

/* 壁纸设置小面板 */
.wp-pop { position: fixed; top: 44px; right: 14px; z-index: 80; width: 218px; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.wp-pop[hidden] { display: none; }
.wp-title { font-size: 12px; font-weight: 600; color: var(--ink-2); letter-spacing: .05em; position: relative; z-index: 1; }
.wp-pop button { position: relative; z-index: 1; appearance: none; border: 1px solid rgb(255 255 255 / 14%); background: rgb(255 255 255 / 8%); color: var(--ink); font: 500 12.5px var(--font-sans); padding: 7px 10px; border-radius: 9px; cursor: pointer; text-align: left; }
.wp-pop button:hover { background: rgb(255 255 255 / 16%); }
.wp-hint { font-size: 11px; color: var(--ink-3); position: relative; z-index: 1; }

/* 拖拽中的 Dock 高亮 */
.dock.drop-hot { outline: 2px dashed rgb(255 255 255 / 65%); outline-offset: 5px; }
.app.dragging, .dock-app.dragging { opacity: .45; }

@media (max-width: 900px) {
  .widgets { display: none; }
  .desktop { padding: 20px 16px 130px; }
  .icon-grid { justify-content: center; }
  .desk-head { justify-content: flex-start; }
  .island { width: min(300px, 52vw); }
  .menubar .meta .dim { display: none; }
  .menu-item { display: none; }
  .menu-item.active { display: block; }
}
</style>
</head>
<body>
<header class="menubar glass">
  <span class="brand">星境</span>
  {{MENU_ITEMS}}
  <span class="spacer"></span>
  <button type="button" class="menu-item" id="wpBtn">换壁纸</button>
  <span class="view-toggle" role="group" aria-label="显示模式">
    <button type="button" id="viewIcon" class="active">图标</button><button type="button" id="viewCard">卡片</button>
  </span>
  <span class="meta"><span class="dim" id="menuDate"></span><span id="menuClock"></span></span>
</header>

<div class="wp-pop glass" id="wpPop" hidden>
  <p class="wp-title">桌面壁纸</p>
  <button type="button" id="wpUploadBtn">上传图片…</button>
  <button type="button" id="wpResetBtn">恢复默认壁纸</button>
  <p class="wp-hint" id="wpHint">JPG / PNG / WebP，上传时自动压缩</p>
</div>
<input type="file" id="wpFile" accept="image/jpeg,image/png,image/webp,image/avif" hidden>

<div class="island" role="search">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="M20 20l-3.8-3.8"/></svg>
  <input id="searchInput" type="text" placeholder="搜索书签或输入网址" autocomplete="off">
  <kbd>/</kbd>
</div>

<aside class="widgets">
  <div class="widget glass">
    <h3>时钟</h3>
    <div class="clock-time" id="widgetClock">--:--</div>
    <div class="clock-date" id="widgetDate"></div>
    <div class="clock-stats">共 {{TOTAL_SITES}} 个书签 · {{CATALOG_COUNT}} 个桌面</div>
  </div>
  <div class="widget glass">
    <h3>便签</h3>
    <textarea id="noteArea" placeholder="随手记点什么…（只存在这台浏览器的本地）"></textarea>
    <div class="note-foot"><span>自动保存</span><span id="noteState"></span></div>
  </div>
</aside>

<main class="stage" id="stage">
  {{DESKTOPS}}
  <section class="results" id="results">
    <div class="desk-head"><h2>搜索结果</h2><span id="resultsCount"></span></div>
    <div class="icon-grid" id="resultsGrid"></div>
  </section>
</main>

<nav class="dots" id="dots">{{DOTS}}</nav>

<div class="settings-window glass" id="settingsWindow" hidden role="dialog" aria-label="设置">
  <div class="sw-bar" id="swBar">
    <div class="traffic-lights">
      <button type="button" class="tl tl-close" id="swClose" aria-label="关闭设置"></button>
      <span class="tl tl-min" aria-hidden="true"></span>
      <span class="tl tl-max" aria-hidden="true"></span>
    </div>
    <span class="sw-title">设置</span>
    <span class="sw-spacer" aria-hidden="true"></span>
  </div>
  <iframe id="settingsFrame" title="星境设置" src="about:blank"></iframe>
</div>

<div class="dock-wrap">
  <div class="dock glass" id="dock">
    {{DOCK_ITEMS}}
    <span class="dock-sep"></span>
    <a class="dock-app dock-admin" href="/admin" data-tip="后台管理" aria-label="后台管理">
      <span class="dock-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg></span>
    </a>
  </div>
</div>

<script>
// 图标加载失败回退：apple-touch-icon → favicon.ico → 露出首字色块。
function iconErr(img) {
  var fav = img.getAttribute('data-fav');
  if (fav && img.src !== fav) { img.src = fav; return; }
  img.remove();
}

// 桌面切换
var desktops = Array.prototype.slice.call(document.querySelectorAll('.desktop'));
var dots = Array.prototype.slice.call(document.querySelectorAll('.dot'));
var menuItems = Array.prototype.slice.call(document.querySelectorAll('.menu-item'));
var current = 0;
function goTo(i) {
  if (i < 0 || i >= desktops.length || document.body.classList.contains('searching')) return;
  current = i;
  desktops.forEach(function (d, j) { d.classList.toggle('active', j === i); });
  dots.forEach(function (d, j) { d.classList.toggle('active', j === i); });
  menuItems.forEach(function (m, j) { m.classList.toggle('active', j === i); });
}
document.querySelectorAll('[data-goto]').forEach(function (el) {
  el.addEventListener('click', function () { goTo(parseInt(el.getAttribute('data-goto'), 10)); });
});
document.addEventListener('keydown', function (e) {
  var tag = document.activeElement && document.activeElement.tagName;
  var typing = tag === 'INPUT' || tag === 'TEXTAREA';
  if (e.key === '/' && !typing) { e.preventDefault(); document.getElementById('searchInput').focus(); return; }
  if (typing) return;
  if (e.key === 'ArrowRight' || e.key === ']') goTo(Math.min(current + 1, desktops.length - 1));
  if (e.key === 'ArrowLeft' || e.key === '[') goTo(Math.max(current - 1, 0));
});
var touchX = null;
document.addEventListener('touchstart', function (e) { touchX = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', function (e) {
  if (touchX === null) return;
  var dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if (Math.abs(dx) < 60) return;
  goTo(dx < 0 ? Math.min(current + 1, desktops.length - 1) : Math.max(current - 1, 0));
}, { passive: true });

// 搜索：跨全部桌面过滤，回车打开首个匹配；直接输入网址回车直达。
var searchInput = document.getElementById('searchInput');
var results = document.getElementById('results');
var resultsGrid = document.getElementById('resultsGrid');
var resultsCount = document.getElementById('resultsCount');
var allApps = Array.prototype.slice.call(document.querySelectorAll('.desktop .app'));
function exitSearch() {
  document.body.classList.remove('searching');
  results.classList.remove('show');
  resultsGrid.innerHTML = '';
}
searchInput.addEventListener('input', function () {
  var q = searchInput.value.trim().toLowerCase();
  if (!q) { exitSearch(); return; }
  document.body.classList.add('searching');
  results.classList.add('show');
  resultsGrid.innerHTML = '';
  var n = 0;
  allApps.forEach(function (app) {
    var hay = (app.getAttribute('data-name') + ' ' + app.getAttribute('data-url') + ' ' + app.getAttribute('data-catalog')).toLowerCase();
    if (hay.indexOf(q) !== -1) { resultsGrid.appendChild(app.cloneNode(true)); n++; }
  });
  resultsCount.textContent = n + ' 个匹配';
});
searchInput.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { searchInput.value = ''; exitSearch(); searchInput.blur(); return; }
  if (e.key !== 'Enter') return;
  var q = searchInput.value.trim();
  if (/^(https?:\/\/)?[\w-]+(\.[\w-]+)+/.test(q) && q.indexOf(' ') === -1) {
    window.open(/^https?:\/\//.test(q) ? q : 'https://' + q, '_blank'); return;
  }
  var first = resultsGrid.querySelector('.app');
  if (first) window.open(first.href, '_blank');
});

// 时钟
function pad(n) { return (n < 10 ? '0' : '') + n; }
var week = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
function tick() {
  var d = new Date();
  var hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
  var dateText = (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + week[d.getDay()];
  document.getElementById('menuClock').textContent = hm;
  document.getElementById('menuDate').textContent = dateText;
  document.getElementById('widgetClock').textContent = hm;
  document.getElementById('widgetDate').textContent = d.getFullYear() + '年' + dateText;
}
tick(); setInterval(tick, 1000);

// 便签（本地保存）
var note = document.getElementById('noteArea');
var noteState = document.getElementById('noteState');
try { note.value = localStorage.getItem('starrealm-note') || ''; } catch (e) {}
var noteTimer = null;
note.addEventListener('input', function () {
  noteState.textContent = '输入中…';
  clearTimeout(noteTimer);
  noteTimer = setTimeout(function () {
    try { localStorage.setItem('starrealm-note', note.value); noteState.textContent = '已保存'; }
    catch (e) { noteState.textContent = '保存失败'; }
  }, 400);
});

// 悬浮设置窗：点 Dock 齿轮在桌面上开窗（内嵌 /admin?embed=1），红点关闭，标题栏可拖动。
var settingsWindow = document.getElementById('settingsWindow');
var settingsFrame = document.getElementById('settingsFrame');
var swBar = document.getElementById('swBar');
function openSettings() {
  settingsFrame.src = '/admin?embed=1';
  settingsWindow.hidden = false;
  settingsWindow.classList.remove('opening');
  void settingsWindow.offsetWidth;
  settingsWindow.classList.add('opening');
}
function closeSettings() {
  settingsWindow.hidden = true;
  settingsFrame.src = 'about:blank';
}
document.addEventListener('click', function (e) {
  var gear = e.target.closest ? e.target.closest('.dock-app[href="/admin"]') : null;
  if (gear) { e.preventDefault(); openSettings(); }
});
document.getElementById('swClose').addEventListener('click', closeSettings);
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !settingsWindow.hidden) closeSettings(); });
(function () {
  var drag = null;
  swBar.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.tl-close')) return;
    var r = settingsWindow.getBoundingClientRect();
    settingsWindow.classList.add('dragged');
    settingsWindow.style.left = r.left + 'px';
    settingsWindow.style.top = r.top + 'px';
    drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
    swBar.setPointerCapture(e.pointerId);
  });
  swBar.addEventListener('pointermove', function (e) {
    if (!drag) return;
    settingsWindow.style.left = Math.min(Math.max(e.clientX - drag.dx, -settingsWindow.offsetWidth + 120), window.innerWidth - 120) + 'px';
    settingsWindow.style.top = Math.min(Math.max(e.clientY - drag.dy, 0), window.innerHeight - 60) + 'px';
  });
  swBar.addEventListener('pointerup', function () { drag = null; });
  swBar.addEventListener('pointercancel', function () { drag = null; });
})();

// 自定义壁纸：上传（浏览器内先压缩）→ 存服务器 KV；恢复默认走 DELETE。
var wpBtn = document.getElementById('wpBtn');
var wpPop = document.getElementById('wpPop');
var wpFile = document.getElementById('wpFile');
var wpHint = document.getElementById('wpHint');
wpBtn.addEventListener('click', function (e) { e.stopPropagation(); wpPop.hidden = !wpPop.hidden; });
document.addEventListener('click', function (e) { if (!wpPop.hidden && !wpPop.contains(e.target)) wpPop.hidden = true; });
function applyWallpaper() {
  document.body.style.backgroundImage = "url('/wallpaper.jpg?t=" + Date.now() + "')";
}
function shrinkImage(file) {
  return createImageBitmap(file).then(function (bmp) {
    var scale = Math.min(1, 2560 / bmp.width);
    if (scale >= 1 && file.size < 1500000) return file;
    var canvas = document.createElement('canvas');
    canvas.width = Math.round(bmp.width * scale); canvas.height = Math.round(bmp.height * scale);
    canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
    return new Promise(function (res) { canvas.toBlob(function (b) { res(b || file); }, 'image/jpeg', 0.82); });
  }).catch(function () { return file; });
}
document.getElementById('wpUploadBtn').addEventListener('click', function () { wpFile.click(); });
wpFile.addEventListener('change', function () {
  var file = wpFile.files && wpFile.files[0];
  if (!file) return;
  wpHint.textContent = '上传中…';
  shrinkImage(file).then(function (blob) {
    return fetch('/api/wallpaper', { method: 'POST', headers: { 'Content-Type': blob.type || 'image/jpeg' }, body: blob });
  }).then(function (r) {
    if (!r.ok) throw new Error('bad');
    wpHint.textContent = '已更新，所有设备打开都是这张';
    applyWallpaper();
  }).catch(function () { wpHint.textContent = '上传失败，换张图试试'; });
  wpFile.value = '';
});
document.getElementById('wpResetBtn').addEventListener('click', function () {
  wpHint.textContent = '恢复中…';
  fetch('/api/wallpaper', { method: 'DELETE' }).then(function (r) {
    if (!r.ok) throw new Error('bad');
    wpHint.textContent = '已恢复默认壁纸';
    applyWallpaper();
  }).catch(function () { wpHint.textContent = '恢复失败'; });
});

// 显示模式（图标/卡片），本地记住选择
var viewIconBtn = document.getElementById('viewIcon');
var viewCardBtn = document.getElementById('viewCard');
function setView(v) {
  document.body.setAttribute('data-view', v);
  viewIconBtn.classList.toggle('active', v === 'icon');
  viewCardBtn.classList.toggle('active', v === 'card');
  try { localStorage.setItem('starrealm-view', v); } catch (e) {}
}
viewIconBtn.addEventListener('click', function () { setView('icon'); });
viewCardBtn.addEventListener('click', function () { setView('card'); });
try { setView(localStorage.getItem('starrealm-view') === 'card' ? 'card' : 'icon'); } catch (e) { setView('icon'); }

// 拖拽钉住：桌面图标拖进 Dock 钉住；Dock 中钉住的图标拖回桌面取消。
var dock = document.getElementById('dock');
var dragCtx = null;
function postDock(id, dockState) {
  return fetch('/api/dock', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: Number(id), dock: dockState }),
  }).then(function (r) { return r.ok; }).catch(function () { return false; });
}
function makeDockTile(appEl) {
  var a = document.createElement('a');
  a.className = 'dock-app';
  a.href = appEl.href; a.target = '_blank'; a.rel = 'noopener noreferrer';
  a.setAttribute('data-tip', appEl.getAttribute('data-name') || '');
  a.setAttribute('data-name', appEl.getAttribute('data-name') || '');
  a.setAttribute('data-id', appEl.getAttribute('data-id'));
  a.setAttribute('data-pinned', '1'); a.draggable = true;
  var icon = document.createElement('span'); icon.className = 'dock-icon';
  var letter = appEl.querySelector('.app-letter');
  if (letter) icon.appendChild(letter.cloneNode(true));
  var img = appEl.querySelector('.app-icon img');
  if (img) { var c = img.cloneNode(); c.removeAttribute('data-fav'); icon.appendChild(c); }
  a.appendChild(icon);
  return a;
}
document.addEventListener('dragstart', function (e) {
  var app = e.target.closest ? e.target.closest('.app, .dock-app') : null;
  if (!app) return;
  var fromDock = app.classList.contains('dock-app');
  if (fromDock && app.getAttribute('data-pinned') !== '1') { e.preventDefault(); return; }
  dragCtx = { id: app.getAttribute('data-id'), from: fromDock ? 'dock' : 'desktop', el: app };
  app.classList.add('dragging');
  try { e.dataTransfer.setData('text/plain', String(dragCtx.id)); e.dataTransfer.effectAllowed = 'copyMove'; } catch (err) {}
});
document.addEventListener('dragend', function () {
  if (dragCtx && dragCtx.el) dragCtx.el.classList.remove('dragging');
  dock.classList.remove('drop-hot'); dragCtx = null;
});
dock.addEventListener('dragover', function (e) {
  if (dragCtx && dragCtx.from === 'desktop') { e.preventDefault(); dock.classList.add('drop-hot'); }
});
dock.addEventListener('dragleave', function () { dock.classList.remove('drop-hot'); });
dock.addEventListener('drop', function (e) {
  if (!dragCtx || dragCtx.from !== 'desktop') return;
  e.preventDefault(); dock.classList.remove('drop-hot');
  var ctx = dragCtx;
  postDock(ctx.id, true).then(function (ok) {
    if (!ok) return;
    if (dock.querySelector('.dock-app[data-id="' + ctx.id + '"]')) return;
    dock.insertBefore(makeDockTile(ctx.el), dock.querySelector('.dock-sep'));
    refreshDockIcons();
  });
});
document.getElementById('stage').addEventListener('dragover', function (e) {
  if (dragCtx && dragCtx.from === 'dock') e.preventDefault();
});
document.getElementById('stage').addEventListener('drop', function (e) {
  if (!dragCtx || dragCtx.from !== 'dock') return;
  e.preventDefault();
  var ctx = dragCtx;
  postDock(ctx.id, false).then(function (ok) { if (ok) { ctx.el.remove(); refreshDockIcons(); } });
});

// Dock 放大效果
var dockIcons = [];
function refreshDockIcons() { dockIcons = Array.prototype.slice.call(dock.querySelectorAll('.dock-icon')); }
refreshDockIcons();
dock.addEventListener('mousemove', function (e) {
  dockIcons.forEach(function (icon) {
    var r = icon.getBoundingClientRect();
    var dist = Math.abs(e.clientX - (r.left + r.width / 2));
    var scale = Math.max(1, 1.38 - dist / 190);
    icon.style.transform = 'scale(' + scale.toFixed(3) + ')';
  });
});
dock.addEventListener('mouseleave', function () {
  dockIcons.forEach(function (icon) { icon.style.transform = ''; });
});
</script>
